function pickVoice(lang,g){
 const k=lang.slice(0,2),ok=l=>l.startsWith(k)||(k=='he'&&l.startsWith('iw'));
 const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>ok(v.lang.replace('_','-').toLowerCase()));
 vs.sort((a,b)=>(b.localService?1:0)-(a.localService?1:0));
 if(!g)return vs[0]||null;
 const male=v=>/\bmale\b|daniel|alex|david|mark|fred|george|james|asaf|arthur|guy|ryan|rishi/i.test(v.name)&&!/female/i.test(v.name);
 const fem=v=>/female|zira|samantha|karen|victoria|susan|hazel|tessa|moira|fiona|carmit|helena|aria|jenny|google us english/i.test(v.name);
 return vs.find(g=='male'?male:fem)||null;
}
function speak(t){
 try{
  if(!('speechSynthesis' in window)){toast('הדפדפן הזה לא תומך בהקראה');return}
  const lang=isEn(t)?'en-US':'he-IL',u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;u.volume=1;
  let g='',pt=1;
  if(S.voice=='male'){g='male';pt=.5}else if(S.voice=='female'){g='female';pt=1.6}
  else if(S.voice=='mine'&&S.hz){g=S.hz>=165?'female':'male';pt=Math.max(.5,Math.min(2,S.hz/(g=='female'?210:120)))}
  const ex=S.vn&&S.vn[lang.slice(0,2)]?speechSynthesis.getVoices().find(x=>x.name==S.vn[lang.slice(0,2)]):null;
  const gv=g?pickVoice(lang,g):null,v=ex||gv||pickVoice(lang,'');
  if(v)u.voice=v;
  if(g&&(S.voice=='mine'||(!gv&&!ex)))u.pitch=pt;
  u.onerror=e=>{if(e.error&&e.error!='canceled'&&e.error!='interrupted')toast('ההקראה נכשלה: '+e.error+'. בדוק שהווליום של המדיה למעלה.')};
  if(speechSynthesis.getVoices().length&&!pickVoice(lang,''))toast(lang=='he-IL'?'אין קול בעברית במכשיר. בהגדרות הטלפון: ניהול כללי ← המרת טקסט לדיבור ← הורד עברית.':'אין קול באנגלית במכשיר.');
  speechSynthesis.cancel();
  setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},120);
 }catch(err){toast('ההקראה נכשלה')}
}

const AI_MODELS=['gemini-2.5-flash','gemini-flash-latest','gemini-2.5-flash-lite','gemini-2.0-flash'];
const DEFAULT_PROXY='';/* כתובת ה-Worker שלך (ראה הוראות). אפשר גם להדביק בהגדרות */
const getProxy=()=>{try{return (localStorage.getItem('aiproxy')||DEFAULT_PROXY).trim()}catch(e){return DEFAULT_PROXY}};
async function aiProxy(prompt){
 const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);
 try{
  const res=await fetch(getProxy(),{method:'POST',headers:{'content-type':'application/json'},signal:ac.signal,body:JSON.stringify({prompt})});
  if(res.status==429)throw new Error('limit');
  if(!res.ok){let m='';try{m=(await res.text()).slice(0,200)}catch(e){}const x=new Error('http'+res.status);x.detail=m;throw x}
  const j=await res.json(),t=j.text||'';
  const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)throw new Error('parse');
  try{return JSON.parse(m[0])}catch(e){throw new Error('parse')}
 }catch(e){if(e&&(e.name=='AbortError'||e instanceof TypeError)){const x=new Error('net');x.detail=String(e.message||e);throw x}throw e}
 finally{clearTimeout(tm)}
}

}

/* ---- העלאת קבצים לחומר ---- */
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f)});
async function docxText(f){
 const buf=new Uint8Array(await f.arrayBuffer()),dv=new DataView(buf.buffer);
 let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)==0x06054b50){e=i;break}}
 if(e<0)throw new Error('docx');
 const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let k=0;k<cnt;k++){
  if(dv.getUint32(p,true)!=0x02014b50)break;
  const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(buf.slice(p+46,p+46+nl));
  if(name=='word/document.xml'){
   const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=buf.slice(st,st+csz);
   let xml;
   if(method==0)xml=new TextDecoder().decode(raw);
   else xml=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<w:br[^>]*\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('docx');
}
async function readFileText(f){
 const n=f.name.toLowerCase();
 if(/\.(txt|md|csv)$/.test(n)||(f.type||'').startsWith('text/'))return await f.text();
 if(n.endsWith('.docx'))return await docxText(f);
 if(n.endsWith('.doc'))throw new Error('olddoc');
 if(f.type=='application/pdf'||n.endsWith('.pdf')||(f.type||'').startsWith('image/')){
  if(f.size>15*1024*1024)throw new Error('big');
  const data=await b64(f),mime=f.type||(n.endsWith('.pdf')?'application/pdf':'image/jpeg');
  const r=await aiJsonA('קרא את הקובץ המצורף (מסמך או תמונה של חומר לימוד, ייתכן בכתב יד) והעתק ממנו את כל הטקסט הלימודי כפי שהוא, בסדר הנכון, בלי להוסיף הסברים משלך. התעלם מכותרות עמוד, מספרי עמודים והערות מורה. החזר JSON בלבד: {"text":"הטקסט"}',[{mime,data}]);
  return String(r.text||'');
 }
 throw new Error('type');
}
const upErr=e=>({olddoc:'זה קובץ Word ישן (doc). שמור אותו כ-docx או כ-PDF ונסה שוב.',big:'הקובץ גדול מדי (מעל 15MB).',type:'סוג הקובץ לא נתמך. אפשר PDF, תמונה, txt או docx.',docx:'לא הצלחתי לקרוא את קובץ ה-Word.',read:'לא הצלחתי לפתוח את הקובץ.'}[e&&e.message])||aiErr(e);
function addUpload(id){
 const ta=$(id);if(!ta)return;
 ta.insertAdjacentHTML('afterend',`<button type="button" class="upb" id="upb-${id}">📎 העלה קובץ או תמונה</button><div class="upm" id="upm-${id}"></div>`);

}
function upSheet(id){
 const old=$('upov');if(old)old.remove();
 const ov=document.createElement('div');ov.id='upov';
 ov.innerHTML=`<div class="sheet"><div class="grip"></div><h3>העלאה מ…</h3><div class="opts">
 <button class="o" data-a=".pdf,.txt,.md,.csv,application/pdf,text/plain"><img src="${IMG['upload-file.png']}" alt="">קבצים<br>בטלפון</button>
 <button class="o" data-a="image/*"><img src="${IMG['upload-image.png']}" alt="">גלריה</button>
 <button class="o" data-a=".docx,.doc"><img src="${IMG['upload-word.png']}" alt="">Docs<br>(Word)</button></div>
 <div class="n">נתמכים: PDF, תמונה, טקסט (txt, md) ו-Word (docx). PDF ותמונות דורשים מפתח ואינטרנט.</div></div>`;
 ov.onclick=e=>{if(e.target===ov)ov.remove()};
 document.body.appendChild(ov);
 ov.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept=b.dataset.a;
  inp.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(inp);inp.onchange=()=>{const fs=[...inp.files];inp.remove();ov.remove();upRun(id,fs)};inp.oncancel=()=>inp.remove();inp.click();
 });
}
async function upRun(id,files){
 const ta=$(id),m=$('upm-'+id);if(!ta||!m||!files.length)return;
 let add=0;
 for(const f of files){
  m.className='upm';m.textContent='קורא את '+f.name+'…';
  try{
   const t=(await readFileText(f)).trim();
   if(!t)throw new Error('empty');
   ta.value=(ta.value.trim()?ta.value.trim()+'\n\n':'')+t;add++;
   m.className='upm ok';m.textContent='✓ נוסף: '+f.name;
  }catch(e){m.className='upm er';m.textContent=f.name+': '+(e&&e.message=='empty'?'לא נמצא טקסט בקובץ.':upErr(e));break}
 }
 if(add>1){m.className='upm ok';m.textContent='✓ נוספו '+add+' קבצים'}
}

 S.grades=S.grades||{};S.nt=S.nt||{};
 const GC={'מתמטיקה':['#2a6df4','#6b9bff'],'היסטוריה':['#d97706','#fbbf24'],'עברית':['#8b5cf6','#b794f6'],'מדעים':['#10a37f','#34d399'],'תנ"ך':['#a16207','#d6a35a'],'אנגלית':['#e11d48','#fb7185']};

 const col=p=>p>=85?'var(--ok)':p>=60?'var(--acc)':'var(--bad)';

  if(sc.length){

   const last=sc.slice(-20).reverse().map(x=>`<div class="item"><span>${esc(lab(x))}<br><small class="mute">${new Date(x.d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}</small></span><span style="text-align:left;font-weight:700;color:${col(pc(x))}">${fmt(x.s)}/${x.t}<br><small>${pc(x)}%</small></span></div>`).join('');
   h+=`<div class="card"><p style="font-weight:600;margin:0 0 4px">תרגולים אחרונים</p>${last}</div><button class="btn sec" id="gd">${gConfirm?'לחץ שוב כדי למחוק את התרגולים':'מחיקת היסטוריית התרגולים'}</button>`;

 const n=GS,g=S.grades[n]||[],a=avg(g),nt=S.nt[n]||0,t=sc.filter(x=>x.k=='test'&&x.sub==n),ta=t.length?Math.round(t.reduce((m,x)=>m+pc(x),0)/t.length):null;
 v.innerHTML=`<div class="gh" style="background:${gr(n)}"><img src="${IM[n]||''}" alt=""><div style="flex:1"><div style="font-size:22px;font-weight:800">${esc(n)}</div><div style="opacity:.95">ממוצע</div></div><div class="gavg">${a===null?'—':a}</div></div>
