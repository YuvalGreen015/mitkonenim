window.imgDiag=async function(){var o=['כתובת: '+location.href];for(var n of ['images/logo.jpg','images/tile-homework.jpg','images/tile-exams.jpg']){try{var r=await fetch(n+'?t='+Date.now(),{cache:'no-store'});o.push(n+' → '+(r.ok?'נמצא ✓':'לא נמצא (שגיאה '+r.status+')'))}catch(e){o.push(n+' → אין חיבור')}}o.push('אם כתוב "לא נמצא": צריך להעלות לגיטהב את התיקייה images עם כל התמונות, באותה תיקייה של index.html');return o.join('\n')};
window.imgFix=async function(){try{var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister()}))}catch(e){}try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}catch(e){}location.reload()};
</script>

let S={cards:[],words:[],subjects:[],mats:{},scores:[],grades:{}},tab=0,SUBJ='',edit=false,mode='list',idx=0,flip=false,queue=[],stat={ok:0,bad:0},cur=null,done=false;
try{const r=localStorage.getItem('study');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.subjects=['מתמטיקה','היסטוריה','עברית','מדעים','תנ"ך','אנגלית'];S.mats=S.mats||{};
const save=()=>{try{localStorage.setItem('study',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
 document.body.classList.add('tbg');
 navDraw();hwBar();histSync();
 if(showSet){settingsView();kbSync();return}
 tab==0?homeView():tab==8?hwView():tab==7?examsView():tab==5?gradesView():tab==4?subjectsView():tab==3?testView():tab==6?podView():tab==1?cardsView():wordsView();
 kbSync();
}
let hp=0,hgn=0;
function histSync(){try{const deep=tab||showSet;if(deep&&!hp){history.pushState({d:1},'');hp=1}else if(!deep&&hp){hp=0;hgn=1;history.back()}}catch(e){}}
window.addEventListener('popstate',()=>{if(hgn){hgn=0;return}hp=0;if(tab||showSet){const b=$('nb');if(b)b.click()}});
/* ---- מבחנים ---- */
function cardsView(){
 const v=$('v');
 if(mode=='quiz'){
  if(!queue.length){if(!stat.saved){stat.saved=1;rec('cards',stat.ok,stat.ok+stat.bad)}v.innerHTML=`<div class="card"><div class="big">סיימת! ✅</div><div class="msg">ידעת ${stat.ok} · לחזור על ${stat.bad}</div><button class="btn" id="back">חזרה</button></div>`;$('back').onclick=()=>{mode='list';render()};return}
  const c=queue[0];
  v.innerHTML=`<div class="card"><div class="mute">נשארו ${queue.length} פתקיות</div><div class="big" id="cd">${esc(flip?c.a:c.q)}</div>
  ${flip?`<div class="row"><button class="btn bad" id="no">עוד לא</button><button class="btn ok" id="yes">ידעתי</button></div>`:`<button class="btn" id="show">הצג תשובה</button>`}
  <button class="btn sec" id="back" style="margin-top:8px">סיום</button></div>`;
  $('back').onclick=()=>{mode='list';render()};
  if(flip){$('yes').onclick=()=>{stat.ok++;queue.shift();flip=false;render()};$('no').onclick=()=>{stat.bad++;queue.push(queue.shift());flip=false;render()}}
  else $('show').onclick=()=>{flip=true;render()};
  return}
 v.innerHTML=`<div class="card"><textarea id="q" rows="2" placeholder="שאלה או מושג"></textarea><textarea id="a" rows="2" placeholder="תשובה"></textarea><button class="btn" id="add">הוסף פתקית</button></div>
 ${S.cards.length?`<button class="btn" id="go">תרגול (${S.cards.length} פתקיות)</button>`:`<p class="mute" style="text-align:center">הוסף פתקיות כדי להתחיל לתרגל</p>`}
 <div class="card" ${S.cards.length?'':'hidden'}>${S.cards.map((c,i)=>`<div class="item"><span>${esc(c.q)}</span><button data-i="${i}" aria-label="מחק">✕</button></div>`).join('')}</div>`;
 $('add').onclick=()=>{const q=$('q').value.trim(),a=$('a').value.trim();if(!q||!a)return;S.cards.push({q,a});save();render()};
 if(S.cards.length)$('go').onclick=()=>{queue=shuffle(S.cards);stat={ok:0,bad:0};flip=false;mode='quiz';render()};
 v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.cards.splice(+b.dataset.i,1);save();render()});
}
/* ---- הכתבות ---- */
function pickVoice(lang,g){
 const k=lang.slice(0,2),ok=l=>l.startsWith(k)||(k=='he'&&l.startsWith('iw'));
 const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>ok(v.lang.replace('_','-').toLowerCase()));
 vs.sort((a,b)=>(b.localService?1:0)-(a.localService?1:0));
 if(!g)return vs[0]||null;
 const male=v=>/\bmale\b|daniel|alex|david|mark|fred|george|james|asaf|arthur|guy|ryan|rishi/i.test(v.name)&&!/female/i.test(v.name);
 const fem=v=>/female|zira|samantha|karen|victoria|susan|hazel|tessa|moira|fiona|carmit|helena|aria|jenny|google us english/i.test(v.name);
 return vs.find(g=='male'?male:fem)||null;
}
function speak(t){
 try{
  if(!('speechSynthesis' in window)){toast('הדפדפן הזה לא תומך בהקראה');return}
  const lang=isEn(t)?'en-US':'he-IL',u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;u.volume=1;
  let g='',pt=1;
  if(S.voice=='male'){g='male';pt=.5}else if(S.voice=='female'){g='female';pt=1.6}
  else if(S.voice=='mine'&&S.hz){g=S.hz>=165?'female':'male';pt=Math.max(.5,Math.min(2,S.hz/(g=='female'?210:120)))}
  const ex=S.vn&&S.vn[lang.slice(0,2)]?speechSynthesis.getVoices().find(x=>x.name==S.vn[lang.slice(0,2)]):null;
  const gv=g?pickVoice(lang,g):null,v=ex||gv||pickVoice(lang,'');
  if(v)u.voice=v;
  if(g&&(S.voice=='mine'||(!gv&&!ex)))u.pitch=pt;
  u.onerror=e=>{if(e.error&&e.error!='canceled'&&e.error!='interrupted')toast('ההקראה נכשלה: '+e.error+'. בדוק שהווליום של המדיה למעלה.')};
  if(speechSynthesis.getVoices().length&&!pickVoice(lang,''))toast(lang=='he-IL'?'אין קול בעברית במכשיר. בהגדרות הטלפון: ניהול כללי ← המרת טקסט לדיבור ← הורד עברית.':'אין קול באנגלית במכשיר.');
  speechSynthesis.cancel();
  setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},120);
 }catch(err){toast('ההקראה נכשלה')}
}
function wordsView(){
 const v=$('v');
 if(mode=='trans'){transView();return}
 if(mode=='quiz'){
  if(!queue.length){if(!stat.saved){stat.saved=1;rec('dict',stat.ok,stat.ok+stat.bad)}v.innerHTML=`<div class="card"><div class="big">סיימת הכתבה! 🎉</div><div class="msg">נכון: ${stat.ok} · טעויות: ${stat.bad}</div><div class="bar"><i style="width:${Math.round(100*stat.ok/Math.max(1,stat.ok+stat.bad))}%"></i></div><button class="btn" id="back">חזרה</button></div>`;$('back').onclick=()=>{mode='list';render()};return}
  cur=queue[0];
  const tot=Math.max(1,S.words.length),doneN=Math.min(tot,tot-queue.length);
  v.innerHTML=`<div class="dpb"><i style="width:${Math.round(100*doneN/tot)}%"></i></div><div class="card"><div class="mute" style="text-align:center">נשארו ${queue.length} מילים</div>${done?`<div class="dword">${esc(cur)}</div>`:`<button class="spk" id="rep" aria-label="שמע שוב">🔊</button>`}
  ${done?'<button class="btn sec" id="rep">שמע שוב</button>':''}<div style="height:8px"></div>
  <input id="ans" dir="${isEn(cur)?'ltr':'rtl'}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="כתוב את המילה"><div class="msg" id="m"></div>
  <button class="btn" id="chk">בדוק</button></div>
  <button class="btn sec" id="back">סיום</button>`;
  $('rep').onclick=()=>speak(cur);$('back').onclick=()=>{mode='list';render()};
  const check=()=>{
   if(done){done=false;queue.shift();render();return}
   const a=$('ans').value.trim();
  if(!a){$('m').style.color='var(--bad)';$('m').textContent='לא רשמת כלום, נסה שוב';return}
   if(nz(a)===nz(cur)){stat.ok++;$('m').style.color='var(--ok)';$('m').textContent='נכון! ✓';done=false;queue.shift();setTimeout(render,700)}
   else{stat.bad++;done=true;$('m').style.color='var(--bad)';$('m').textContent='לא מדויק. כך כותבים:';$('chk').textContent='הבנתי, הבא';{const sp=$('rep');if(sp&&sp.classList.contains('spk')){const dw=document.createElement('div');dw.className='dword';dw.textContent=cur;sp.insertAdjacentElement('beforebegin',dw)}}}
  };
  $('chk').onclick=check;$('ans').onkeydown=e=>{if(e.key=='Enter')check()};
  if(!done)setTimeout(()=>speak(cur),50);
  return}
 v.innerHTML=`<div class="card"><textarea id="w" rows="4" placeholder="מילים להכתבה, מילה בכל שורה (או מופרדות בפסיק)"></textarea><button class="btn" id="add">הוסף מילים</button></div>
 ${S.words.length?`<button class="btn" id="go">התחל הכתבה (${S.words.length} מילים)</button>`:`<p class="mute" style="text-align:center">הוסף את מילות ההכתבה והאפליקציה תקריא אותן</p>`}

function detectPitch(buf,sr){
 let e=0;for(let i=0;i<buf.length;i++)e+=buf[i]*buf[i];
 if(Math.sqrt(e/buf.length)<0.01)return 0;
 const lo=Math.floor(sr/400),hi=Math.floor(sr/70);let best=0,bl=0;
 for(let lag=lo;lag<=hi;lag++){let c=0;for(let i=0;i<buf.length-lag;i++)c+=buf[i]*buf[i+lag];if(c>best){best=c;bl=lag}}
 return bl&&best/e>0.3?sr/bl:0;
}
async function recordVoice(){
 if(recBusy)return;recMsg='';recBusy=true;render();
 let st,ctx;
 try{
  st=await navigator.mediaDevices.getUserMedia({audio:true});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const an=ctx.createAnalyser();an.fftSize=4096;ctx.createMediaStreamSource(st).connect(an);
  const buf=new Float32Array(an.fftSize),hz=[],t0=Date.now();
  await new Promise(res=>{const iv=setInterval(()=>{an.getFloatTimeDomainData(buf);const f=detectPitch(buf,ctx.sampleRate);if(f)hz.push(f);if(Date.now()-t0>3000){clearInterval(iv);res()}},60)});
  hz.sort((x,y)=>x-y);
  if(hz.length<8)recMsg='לא שמעתי מספיק. אמור "אאאאא" חזק וברור, קרוב למיקרופון, ונסה שוב.';
  else{S.hz=Math.round(hz[hz.length>>1]);S.voice='mine';save()}
 }catch(e){recMsg='אין גישה למיקרופון. אפשר במקום זה להזיז את מחוון גובה הקול למטה.'}

 recBusy=false;render();
}

function localPod(text,sub,n){

 if(ss.length<3)return null;
 const L=[],a=t=>L.push({w:'a',t}),b=t=>L.push({w:'b',t});
 const ask=['ספר לי עוד, מה עוד חשוב לדעת?','ומה לגבי ההמשך?','וואו, ואיך זה ממשיך?','יופי, ומה אחר כך?','זה מעניין, תוסיף עוד קצת.','ומה עוד כדאי שנזכור?'];

 const cl=x=>x.replace(/[.!?:;]+$/,'');
 a('היי, אני נועה, ברוכים הבאים לפודקאסט הלימוד.');b('ואני דני. היום נלמד יחד על '+sub+'.');
 a('מצוין, בוא נתחיל. מה הדבר הראשון שצריך לדעת?');
 let i=0,k=0;const room=Math.max(2,n-6);
 for(const x of ss){
  if(L.length>=room)break;
  const d=defOf(x);
  if(d){a(d.q);b(cl(d.a)+'.')}
  else{b(k%3==0&&i>0?link[k%link.length]+cl(x.replace(/^(ש|ה)(?=\S)/,'$1'))+'.':cl(x)+'.');if(L.length<room)a(ask[k%ask.length]);k++}
  i++;
 }
 if(L[L.length-1].w=='a')L.pop();
 a('בואו נסכם: איזה דבר אחד הכי כדאי לזכור?');
 b('הנקודה המרכזית: '+cl(ss[0])+'. כדאי לחזור על זה שוב.');
 a('תודה שהקשבתם, ובהצלחה בלימודים!');b('ביי ביי.');
 return{title:sub,lines:L};
}

/* ---- העלאת קבצים לחומר ---- */
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f)});
async function docxText(f){
 const buf=new Uint8Array(await f.arrayBuffer()),dv=new DataView(buf.buffer);
 let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)==0x06054b50){e=i;break}}
 if(e<0)throw new Error('docx');
 const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let k=0;k<cnt;k++){
  if(dv.getUint32(p,true)!=0x02014b50)break;
  const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(buf.slice(p+46,p+46+nl));
  if(name=='word/document.xml'){
   const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=buf.slice(st,st+csz);
   let xml;
   if(method==0)xml=new TextDecoder().decode(raw);
   else xml=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<w:br[^>]*\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('docx');
}
async function readFileText(f){
 const n=f.name.toLowerCase();
 if(/\.(txt|md|csv)$/.test(n)||(f.type||'').startsWith('text/'))return await f.text();
 if(n.endsWith('.docx'))return await docxText(f);
 if(n.endsWith('.doc'))throw new Error('olddoc');
 if(f.type=='application/pdf'||n.endsWith('.pdf')||(f.type||'').startsWith('image/')){
  if(f.size>15*1024*1024)throw new Error('big');
  const data=await b64(f),mime=f.type||(n.endsWith('.pdf')?'application/pdf':'image/jpeg');
  const r=await aiJson('קרא את הקובץ המצורף (מסמך או תמונה של חומר לימוד, ייתכן בכתב יד) והעתק ממנו את כל הטקסט הלימודי כפי שהוא, בסדר הנכון, בלי להוסיף הסברים משלך. התעלם מכותרות עמוד, מספרי עמודים והערות מורה. החזר JSON בלבד: {"text":"הטקסט"}',[{mime,data}]);
  return String(r.text||'');
 }
 throw new Error('type');
}
const upErr=e=>({olddoc:'זה קובץ Word ישן (doc). שמור אותו כ-docx או כ-PDF ונסה שוב.',big:'הקובץ גדול מדי (מעל 15MB).',type:'סוג הקובץ לא נתמך. אפשר PDF, תמונה, txt או docx.',docx:'לא הצלחתי לקרוא את קובץ ה-Word.',read:'לא הצלחתי לפתוח את הקובץ.'}[e&&e.message])||aiErr(e);

function upSheet(id){

 <div class="n">נתמכים: PDF, תמונה, טקסט (txt, md) ו-Word (docx). PDF ותמונות דורשים מפתח ואינטרנט.</div></div>`;

async function upRun(id,files){
 const ta=$(id),m=$('upm-'+id);if(!ta||!m||!files.length)return;
 let add=0;
 for(const f of files){
  m.className='upm';m.textContent='קורא את '+f.name+'…';
  try{
   const t=(await readFileText(f)).trim();
   if(!t)throw new Error('empty');
   ta.value=(ta.value.trim()?ta.value.trim()+'\n\n':'')+t;add++;
   m.className='upm ok';m.textContent='✓ נוסף: '+f.name;
  }catch(e){m.className='upm er';m.textContent=f.name+': '+(e&&e.message=='empty'?'לא נמצא טקסט בקובץ.':upErr(e));break}
 }
 if(add>1){m.className='upm ok';m.textContent='✓ נוספו '+add+' קבצים'}
}
