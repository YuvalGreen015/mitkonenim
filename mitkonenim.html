#upov .o img{display:block;width:68px;height:68px;margin:0 auto 6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}

#upov .n{font-size:13px;color:#5d6b85;margin-top:14px;text-align:center}
.tbg #v>p,.tbg #v>.mute{color:#fff}
.tbg #v>.mute{opacity:.9}
#v .card>.btn{margin-top:12px}#v .card>.btn.sec{margin-top:12px}
#v>.btn{margin-top:14px}#v>.btn.sec{margin-top:14px}

.spk:active{transform:scale(.95)}

let askLog=[],askBusy=false;
async function askAI(q){
 const hist=askLog.slice(-2).map(x=>'שאלה: '+x.q+'\nתשובה: '+x.a).join('\n\n');
 const sub=(typeof SUBJ=='string'&&SUBJ)?'התלמיד לומד כרגע: '+SUBJ+'. ':'';
 const pr='אתה מורה סבלני שעונה לתלמיד/ה בישראל. '+sub+'ענה בעברית פשוטה וברורה, בקצרה (עד 6 משפטים). אם השאלה באנגלית, ענה בעברית והוסף את המילים באנגלית. אל תמציא עובדות: אם אינך בטוח, כתוב זאת במפורש. אם זו שאלת חשבון, הראה את שלבי הפתרון בקצרה.'+(hist?'\n\nשיחה קודמת:\n'+hist:'')+'\n\nשאלת התלמיד: '+q+'\n\nהחזר JSON בלבד בפורמט: {"answer":"התשובה כאן"}';
 const r=await aiJson(pr);
 let a=r&&(r.answer||r.text||r.a)||(typeof r=='string'?r:'')||(Array.isArray(r)&&r[0]&&(r[0].answer||r[0].text||r[0]))||'';
 a=fixHe(deTex(String(a))).trim();
 if(!a)throw new Error('parse');
 return a;
}
function cardsView(){
 const v=$('v');
 if(mode=='quiz'){
  if(!queue.length){if(!stat.saved){stat.saved=1;rec('cards',stat.ok,stat.ok+stat.bad)}v.innerHTML=`<div class="card"><div class="big">סיימת! ✅</div><div class="msg">ידעת ${stat.ok} · לחזור על ${stat.bad}</div><button class="btn" id="back">חזרה</button></div>`;$('back').onclick=()=>{mode='list';render()};return}
  const c=queue[0];
  v.innerHTML=`<div class="card"><div class="mute">נשארו ${queue.length} פתקיות</div><div class="big" id="cd">${esc(flip?c.a:c.q)}</div>
  ${flip?`<div class="row"><button class="btn bad" id="no">עוד לא</button><button class="btn ok" id="yes">ידעתי</button></div>`:`<button class="btn" id="show">הצג תשובה</button>`}
  <button class="btn sec" id="back" style="margin-top:8px">סיום</button></div>`;
  $('back').onclick=()=>{mode='list';render()};
  if(flip){$('yes').onclick=()=>{stat.ok++;queue.shift();flip=false;render()};$('no').onclick=()=>{stat.bad++;queue.push(queue.shift());flip=false;render()}}
  else $('show').onclick=()=>{flip=true;render()};
  return}
 v.innerHTML=`<div class="card"><div style="font-weight:800;margin-bottom:6px">🤖 שאל את ה-AI</div><textarea id="aq" rows="2" placeholder="כתוב כאן שאלה, וה-AI יענה"></textarea><button class="btn" id="ask">${askBusy?'חושב...':'שאל'}</button><div id="alog">${askLog.slice().reverse().map((x,i)=>`<div class="item" style="display:block;margin-top:10px"><div style="font-weight:700">❓ ${esc(x.q)}</div><div style="white-space:pre-wrap;margin-top:4px">${esc(x.a)}</div><button class="btn sec" data-sv="${askLog.length-1-i}" style="margin-top:6px">➕ שמור כפתקית</button></div>`).join('')}</div></div>
 <div class="card"><textarea id="q" rows="2" placeholder="שאלה או מושג"></textarea><textarea id="a" rows="2" placeholder="תשובה"></textarea><button class="btn" id="add">הוסף פתקית</button></div>
 ${S.cards.length?`<button class="btn" id="go">תרגול (${S.cards.length} פתקיות)</button>`:`<p class="mute" style="text-align:center">הוסף פתקיות כדי להתחיל לתרגל</p>`}

 $('add').onclick=()=>{const q=$('q').value.trim(),a=$('a').value.trim();if(!q||!a)return;S.cards.push({q,a});save();render()};
 $('ask').onclick=async()=>{const q=$('aq').value.trim();if(!q||askBusy)return;if(!hasAI()){toast('ה-AI לא זמין כרגע. נסה שוב עוד רגע.');return}

  askBusy=false;if(mode=='list'&&tab==1)render()};

}
/* ---- הכתבות ---- */
function pickVoice(lang,g){
 const k=lang.slice(0,2),ok=l=>l.startsWith(k)||(k=='he'&&l.startsWith('iw'));
 const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>ok(v.lang.replace('_','-').toLowerCase()));
 vs.sort((a,b)=>(b.localService?1:0)-(a.localService?1:0));
 if(!g)return vs[0]||null;
 const male=v=>/\bmale\b|daniel|alex|david|mark|fred|george|james|asaf|arthur|guy|ryan|rishi/i.test(v.name)&&!/female/i.test(v.name);
 const fem=v=>/female|zira|samantha|karen|victoria|susan|hazel|tessa|moira|fiona|carmit|helena|aria|jenny|google us english/i.test(v.name);
 return vs.find(g=='male'?male:fem)||null;
}
function speak(t){
 try{
  if(!('speechSynthesis' in window)){toast('הדפדפן הזה לא תומך בהקראה');return}
  const lang=isEn(t)?'en-US':'he-IL',u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;u.volume=1;
  let g='',pt=1;
  if(S.voice=='male'){g='male';pt=.5}else if(S.voice=='female'){g='female';pt=1.6}
  else if(S.voice=='mine'&&S.hz){g=S.hz>=165?'female':'male';pt=Math.max(.5,Math.min(2,S.hz/(g=='female'?210:120)))}
  const ex=S.vn&&S.vn[lang.slice(0,2)]?speechSynthesis.getVoices().find(x=>x.name==S.vn[lang.slice(0,2)]):null;
  const gv=g?pickVoice(lang,g):null,v=ex||gv||pickVoice(lang,'');
  if(v)u.voice=v;
  if(g&&(S.voice=='mine'||(!gv&&!ex)))u.pitch=pt;
  u.onerror=e=>{if(e.error&&e.error!='canceled'&&e.error!='interrupted')toast('ההקראה נכשלה: '+e.error+'. בדוק שהווליום של המדיה למעלה.')};
  if(speechSynthesis.getVoices().length&&!pickVoice(lang,''))toast(lang=='he-IL'?'אין קול בעברית במכשיר. בהגדרות הטלפון: ניהול כללי ← המרת טקסט לדיבור ← הורד עברית.':'אין קול באנגלית במכשיר.');
  speechSynthesis.cancel();
  setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},120);
 }catch(err){toast('ההקראה נכשלה')}
}
function wordsView(){
 const v=$('v');

function detectPitch(buf,sr){
 let e=0;for(let i=0;i<buf.length;i++)e+=buf[i]*buf[i];
 if(Math.sqrt(e/buf.length)<0.01)return 0;
 const lo=Math.floor(sr/400),hi=Math.floor(sr/70);let best=0,bl=0;
 for(let lag=lo;lag<=hi;lag++){let c=0;for(let i=0;i<buf.length-lag;i++)c+=buf[i]*buf[i+lag];if(c>best){best=c;bl=lag}}
 return bl&&best/e>0.3?sr/bl:0;
}
async function recordVoice(){

  st=await navigator.mediaDevices.getUserMedia({audio:true});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const an=ctx.createAnalyser();an.fftSize=4096;ctx.createMediaStreamSource(st).connect(an);

  await new Promise(res=>{const iv=setInterval(()=>{an.getFloatTimeDomainData(buf);const f=detectPitch(buf,ctx.sampleRate);if(f)hz.push(f);if(Date.now()-t0>3000){clearInterval(iv);res()}},60)});

const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f)});
async function docxText(f){
 const buf=new Uint8Array(await f.arrayBuffer()),dv=new DataView(buf.buffer);
 let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)==0x06054b50){e=i;break}}
 if(e<0)throw new Error('docx');
 const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let k=0;k<cnt;k++){
  if(dv.getUint32(p,true)!=0x02014b50)break;
  const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(buf.slice(p+46,p+46+nl));
  if(name=='word/document.xml'){
   const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=buf.slice(st,st+csz);
   let xml;
   if(method==0)xml=new TextDecoder().decode(raw);
   else xml=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<w:br[^>]*\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('docx');
}

  h+=`<div class="grid">${S.subjects.map((n,i)=>{const a=avg(S.grades[n]||[]);return `<button class="subj" data-gs="${i}"><img class="si" src="${IM[n]||''}" alt=""><b>${esc(n)}</b><span class="gb" style="background:${gr(n)}">${a===null?'אין ציונים':a}</span></button>`}).join('')}</div>`;
  if(sc.length){
   const lab=x=>x.k=='test'?'מבחן · '+x.sub:x.k=='trans'?'תרגום מילים':x.k=='dict'?'הכתבה':'פתקיות';
   const last=sc.slice(-20).reverse().map(x=>`<div class="item"><span>${esc(lab(x))}<br><small class="mute">${new Date(x.d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}</small></span><span style="text-align:left;font-weight:700;color:${col(pc(x))}">${fmt(x.s)}/${x.t}<br><small>${pc(x)}%</small></span></div>`).join('');
   h+=`<div class="card"><p style="font-weight:600;margin:0 0 4px">תרגולים אחרונים</p>${last}</div><button class="btn sec" id="gd">${gConfirm?'לחץ שוב כדי למחוק את התרגולים':'מחיקת היסטוריית התרגולים'}</button>`;
  }
  v.innerHTML=h;
  v.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{GS=S.subjects[+b.dataset.gs];render()});
  if($('gd'))$('gd').onclick=()=>{if(!gConfirm){gConfirm=true;render();return}S.scores=[];gConfirm=false;save();render()};
  return}
 const n=GS,g=S.grades[n]||[],a=avg(g),nt=S.nt[n]||0,t=sc.filter(x=>x.k=='test'&&x.sub==n),ta=t.length?Math.round(t.reduce((m,x)=>m+pc(x),0)/t.length):null;
 v.innerHTML=`<div class="gh" style="background:${gr(n)}"><img src="${IM[n]||''}" alt=""><div style="flex:1"><div style="font-size:22px;font-weight:800">${esc(n)}</div><div style="opacity:.95">ממוצע</div></div><div class="gavg">${a===null?'—':a}</div></div>
 <div class="card"><label class="mute" for="nt">כמות מבחנים</label><input id="nt" type="number" inputmode="numeric" min="0" max="50" value="${nt||''}" placeholder="כמה מבחנים היו?">
 <label class="mute" for="gi">ציון (אחד בכל פעם)</label><input id="gi" type="number" inputmode="numeric" min="0" max="100" placeholder="לדוגמה 90">
 <button class="btn" id="ga" style="background:${gr(n)}">הוסף ציון</button>
 <div style="margin-top:12px">${g.map((x,j)=>`<span class="chip" style="border-color:${col(x)}">${x}<b data-gd="${j}">✕</b></span>`).join('')||'<span class="mute">עוד לא הוספת ציונים</span>'}</div>
 <div class="mute" style="margin-top:8px">הוזנו ${g.length}${nt?' מתוך '+nt:''} מבחנים</div>
 ${nt?`<div class="bar"><i style="width:${Math.min(100,Math.round(100*g.length/nt))}%;background:${(GC[n]||GC['מתמטיקה'])[0]}"></i></div>`:''}
 ${ta!==null?`<div class="mute" style="margin-top:8px">תרגול במבחנים באפליקציה: ${ta}% (${t.length})</div>`:''}</div>`;
 $('nt').onchange=()=>{S.nt[n]=Math.max(0,Math.min(50,parseInt($('nt').value)||0));save();render()};
 $('ga').onclick=()=>{const x=parseFloat($('gi').value);if(isNaN(x)||x<0||x>100)return;S.grades[n]=(S.grades[n]||[]).concat(x);save();render()};
 v.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{S.grades[n].splice(+b.dataset.gd,1);save();render()});
}

try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('02_sw.js').catch(()=>{})}catch(e){}
